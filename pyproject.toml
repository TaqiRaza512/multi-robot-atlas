[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-robot-atlas"
version = "0.1.0"
description = "Deterministic 3D multi-drone navigation simulator and benchmark built on MuJoCo (early development)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=4.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
video = ["imageio[ffmpeg]>=2.34"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["mujoco.*", "imageio.*"]
ignore_missing_imports = true
